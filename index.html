<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/my-wallet/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="expense_tracker">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>expense_tracker</title>
  <link rel="manifest" href="manifest.json">
  <script src="https://unpkg.com/@lottiefiles/lottie-player@latest/dist/lottie-player.js"></script>
  <style>
    body {
      background-color: #F2F8F7;
      margin: 0;
      height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    .loader-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: #F2F8F7;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      overflow: hidden;
    }
    .aurora-blob {
      position: absolute;
      border-radius: 50%;
      filter: blur(100px);
      z-index: -1;
      animation: float 10s infinite ease-in-out alternate;
    }
    .blob-1 {
      top: -20%; left: -10%; width: 60vw; height: 60vw; background: rgba(56, 178, 172, 0.4); /* Cyan */
    }
    .blob-2 {
      bottom: -20%; right: -10%; width: 70vw; height: 70vw; background: rgba(13, 148, 136, 0.5); /* Teal */
      animation-delay: -5s;
    }
    .blob-3 {
      top: 30%; left: 20%; width: 50vw; height: 50vw; background: rgba(45, 212, 191, 0.3); /* Light Teal */
      animation-duration: 15s;
    }
    @keyframes float {
      0% { transform: translate(0, 0) scale(1); }
      100% { transform: translate(5vw, 5vh) scale(1.1); }
    }
    .statement {
      font-size: 1.4rem;
      font-weight: 600;
      color: #0F172A;
      letter-spacing: 0.5px;
      text-align: center;
      max-width: 80%;
      margin-top: -10px;
      transition: opacity 0.5s ease-in-out;
    }
    .company {
      font-size: 0.75rem;
      color: #475569;
      margin-top: 8px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1.5px;
    }
  </style>
</head>
<body>
  <div id="loading-screen" class="loader-container">
    <div class="aurora-blob blob-1"></div>
    <div class="aurora-blob blob-2"></div>
    <div class="aurora-blob blob-3"></div>
    
    <div class="statement" id="loading-statement">Time is money.<br><span style="font-size:0.9rem;color:#475569;font-weight:500;">- Benjamin Franklin</span></div>
    <div class="company">OrbitView Innovations</div>
  </div>

  <script src="flutter_bootstrap.js" async></script>
  
  <script>
    const quotes = [
      'Time is money.<br><span style="font-size:0.9rem;color:#475569;font-weight:500;">- Benjamin Franklin</span>',
      'Invest in what you know.<br><span style="font-size:0.9rem;color:#475569;font-weight:500;">- Peter Lynch</span>',
      'Every day is a bank account.<br><span style="font-size:0.9rem;color:#475569;font-weight:500;">- Christopher Morley</span>',
      'Before you spend, earn.<br><span style="font-size:0.9rem;color:#475569;font-weight:500;">- William Arthur Ward</span>',
      'Never depend on a single income.<br><span style="font-size:0.9rem;color:#475569;font-weight:500;">- Warren Buffett</span>',
      'Take decisions based on data, not emotions.<br><span style="font-size:0.9rem;color:#475569;font-weight:500;">- Dhammika Perera</span>'
    ];
    let quoteIndex = 0;
    const statementEl = document.getElementById('loading-statement');
    let quoteInterval;

    if (statementEl) {
      quoteInterval = setInterval(() => {
        statementEl.style.opacity = '0';
        setTimeout(() => {
          quoteIndex = (quoteIndex + 1) % quotes.length;
          statementEl.innerHTML = quotes[quoteIndex];
          statementEl.style.opacity = '1';
        }, 500);
      }, 3000);
    }

    // Remove the loading screen once Flutter renders the first frame
    window.addEventListener('flutter-first-frame', function() {
      if (quoteInterval) clearInterval(quoteInterval);
      var loadingScreen = document.getElementById('loading-screen');
      if (loadingScreen) {
        loadingScreen.style.transition = 'opacity 0.5s ease-out';
        loadingScreen.style.opacity = '0';
        setTimeout(function() {
          loadingScreen.remove();
        }, 500);
      }
    });
  </script>
</body>
</html>
